<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد جدول الدورات</title>
<style>
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/Cairo-Regular.ttf)}
@font-face{font-family:Cairo;font-weight:600;src:url(fonts/Cairo-SemiBold.ttf)}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/Cairo-Bold.ttf)}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/Cairo-ExtraBold.ttf)}
body{font-family:Cairo,sans-serif;background:#f3f3ee;margin:0;padding:20px;color:#1d3a10}
.bar{max-width:900px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input[type=text]{flex:1;min-width:280px;padding:10px;font:inherit;border:1px solid #aaa;border-radius:8px}
button,label.btn{background:#57641e;color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.alt,label.btn{background:#a98421}
.themes{display:inline-flex;border:2px solid #57641e;border-radius:8px;overflow:hidden}
.themes button{background:#fff;color:#57641e;border-radius:0;padding:8px 14px}
.themes button.active{background:#57641e;color:#fff}
#msg{max-width:900px;margin:0 auto 10px;color:#a00}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;box-shadow:0 2px 12px #0003;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <div class="themes" role="group" aria-label="اختيار التصميم">
    <button type="button" data-theme="1" class="active">التصميم الأول</button>
    <button type="button" data-theme="2">التصميم الثاني</button>
  </div>
  <input id="date" type="text" placeholder="اكتب سطر التاريخ، مثال: من تاريخ 29/4/1448 إلى 29/6/1448 هـ الموافق 10/10/2026 إلى 9/12/2026 م">
  <button id="refresh">تحديث من الشيت</button>
  <label class="btn">رفع CSV<input id="file" type="file" accept=".csv" hidden></label>
  <button id="dl" class="alt">تحميل الصورة PNG</button>
</div>
<div id="msg"></div>
<canvas id="cv"></canvas>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
